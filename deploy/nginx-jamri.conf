limit_req_zone $binary_remote_addr zone=jamri_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=jamri_ws:10m;

server {
    listen 80;
    listen [::]:80;
    server_name jamming.zhafron.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jamming.zhafron.my.id;
    root /opt/jamri;

    ssl_certificate     /etc/nginx/tls/jamri.crt;
    ssl_certificate_key /etc/nginx/tls/jamri.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/jamri-cloudflare-realip.conf;

    access_log /var/log/nginx/jamri.access.log main;
    error_log /var/log/nginx/jamri.error.log warn;

    client_max_body_size 1m;
    client_body_buffer_size 64k;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php-fpm/jamri.sock;
        include fastcgi.conf;
    }

    location ~ ^/api/[a-z_]+\.php$ {
        limit_req zone=jamri_api burst=40 nodelay;
        limit_req_status 429;
        try_files $uri =404;
        fastcgi_pass unix:/run/php-fpm/jamri.sock;
        include fastcgi.conf;
    }

    location = /ws {
        limit_conn jamri_ws 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /public/sw.js {
        expires -1;
    }

    location ^~ /public/ {
        try_files $uri =404;
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}
